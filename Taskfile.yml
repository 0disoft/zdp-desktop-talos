version: '3'

tasks:
  format:
    cmds:
      - go fmt ./...

  lint:
    cmds:
      - go vet ./...

  typecheck:
    dir: frontend
    cmds:
      - bun run check

  test:
    deps: [typecheck]
    cmds:
      - go test ./...

  contract:
    cmds:
      - go test ./internal/workeripc ./internal/domain/event

  migration-check:
    cmds:
      - go test ./internal/adapters/sqliteevent

  smoke:
    cmds:
      - go run ./cmd/talosctl doctor --json

  docs:
    cmds:
      - echo "Use the configured ssealed strict-doctor intent from the workspace root."
      - exit 1

  check:
    deps: [lint, typecheck, test, contract, migration-check]

  frontend:build:
    dir: frontend
    cmds:
      - bun run build

  build:
    deps: [frontend:build]
    cmds:
      - go build ./...

  windows:package-contract:
    cmds:
      - go test ./internal/releasepack

  windows:package:
    summary: Build a Windows installer on a provisioned signing host
    cmds:
      - powershell.exe -NoProfile -NonInteractive -File packaging/windows/package.ps1 -Version 0.27.0 -RequireSignature
